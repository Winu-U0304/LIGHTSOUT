<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="favicon.png"
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☆★games</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #09031e, #1a0b36, #3b1454);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        h1 {
            margin-bottom: 5px;
            font-size: 2rem;
            text-shadow: 0 0 15px rgba(250, 204, 21, 0.5), 0 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .mode-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            z-index: 2;
        }
        .mode-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #cbd5e1;
            padding: 6px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #4f46e5;
            color: white;
            border-color: #6366f1;
            box-shadow: 0 0 10px rgba(79, 70, 229, 0.5);
        }
        
        .accordion-wrapper {
            width: 100%;
            max-width: 360px;
            margin-bottom: 12px;
            z-index: 2;
        }
        .accordion-btn {
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #e0e7ff;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            text-align: center;
            transition: background 0.2s;
            backdrop-filter: blur(4px);
        }
        .accordion-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .accordion-content {
            display: none;
            background: rgba(10, 5, 25, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 15px;
            margin-top: 5px;
            font-size: 0.85rem;
            color: #c7d2fe;
            line-height: 1.5;
            backdrop-filter: blur(6px);
        }
        .accordion-content.show {
            display: block;
        }

        .game-container {
            background: rgba(255, 255, 255, 0.06);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
        }
        .settings {
            margin-bottom: 12px;
            display: flex;
            gap: 15px;
            align-items: center;
            font-size: 0.9rem;
        }
        select {
            background: rgba(255, 255, 255, 0.15);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        select option {
            background: #1a0b36;
            color: white;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
            font-size: 0.95rem;
            color: #e0e7ff;
            padding: 0 5px;
        }
        .grid {
            display: grid;
            gap: 8px;
            margin-bottom: 15px;
        }
        .cell {
            background-color: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s ease;
        }
        .cell:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: rgba(250, 204, 21, 0.6);
            transform: scale(1.05);
        }
        .cell.active {
            background-color: rgba(250, 204, 21, 0.25);
            border-color: #facc15;
            text-shadow: 0 0 12px #facc15, 0 0 20px rgba(250, 204, 21, 0.5);
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        button.action-btn {
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.95rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        button.action-btn:hover {
            background-color: #4338ca;
        }
        button.action-btn:active {
            transform: scale(0.95);
        }
        button.sub-btn {
            background-color: #059669;
        }
        button.sub-btn:hover {
            background-color: #047857;
        }

        #win-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 25, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fadeIn 0.3s ease;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        #win-overlay h2 {
            color: #facc15;
            font-size: 1.8rem;
            margin: 0 0 8px 0;
            text-shadow: 0 0 20px rgba(250, 204, 21, 0.8);
        }
        #win-overlay p {
            font-size: 0.95rem;
            margin-bottom: 12px;
            color: #fff;
        }
        .url-box {
            background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            word-break: break-all;
            max-width: 280px;
            margin-bottom: 12px;
            color: #38bdf8;
            max-height: 60px;
            overflow-y: auto;
        }
        .result-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 220px;
        }
        .btn-twitter {
            background-color: #000000;
            color: white;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .btn-twitter:hover {
            background-color: #222222;
        }
        .btn-share {
            background-color: #0284c7;
            color: white;
        }
        .btn-share:hover {
            background-color: #0369a1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="space-canvas"></canvas>

    <h1>✨ ☆★games ✨</h1>

    <div class="mode-tabs">
        <button class="mode-btn active" id="tabPlay" onclick="switchMode('play')">🎮 プレイモード</button>
        <button class="mode-btn" id="tabMaker" onclick="switchMode('maker')">🛠️ メーカーモード</button>
    </div>

    <div class="accordion-wrapper">
        <button class="accordion-btn" id="accordionBtn" onclick="toggleAccordion()">▼ ゲームの説明を見る</button>
        <div class="accordion-content" id="accordionContent">
            パネルをクリックすると、上下左右の星が反転します。<br>すべてのパネルを「★」に揃えてクリアを目指しましょう！
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div id="win-overlay">
            <h2 id="win-title">🎉 成功！ 🎉</h2>
            <p id="clear-stats"></p>
            <div id="url-container" style="display:none;">
                <p style="margin:4px 0; font-size:0.8rem; color:#facc15;">全画面プレイ用URL:</p>
                <div class="url-box" id="shareUrlBox"></div>
            </div>
            <div class="result-buttons" id="resultButtons">
                <button class="action-btn btn-twitter" onclick="tweetScore()">🐦 Xでポストする</button>
                <button class="action-btn btn-share" onclick="copyShareUrl()">🔗 URLをコピーする</button>
                <button class="action-btn" onclick="initGame()">もう一度あそぶ</button>
            </div>
        </div>

        <div class="settings">
            <label id="sizeLabel">サイズ: 
                <select id="sizeSelect" onchange="changeSize()">
                    <option value="3">3 × 3 (かんたん)</option>
                    <option value="4" selected>4 × 4 (ふつう)</option>
                    <option value="5">5 × 5 (むずかしい)</option>
                </select>
            </label>
        </div>

        <div class="status-bar">
            <span id="timer">タイム: 0.0秒</span>
            <span id="moves">手数: 0回</span>
        </div>

        <div class="grid" id="grid"></div>

        <div class="controls" id="controlsArea">
            <button class="action-btn" onclick="initGame()">やり直す</button>
        </div>
    </div>

    <script>
        const spaceCanvas = document.getElementById('space-canvas');
        const sCtx = spaceCanvas.getContext('2d');
        let stars = [];

        function resizeSpace() {
            spaceCanvas.width = window.innerWidth;
            spaceCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeSpace);
        resizeSpace();

        for (let i = 0; i < 70; i++) {
            stars.push({
                x: Math.random() * spaceCanvas.width,
                y: Math.random() * spaceCanvas.height,
                radius: Math.random() * 1.8 + 0.5,
                alpha: Math.random(),
                speed: Math.random() * 0.015 + 0.005
            });
        }

        function animateSpace() {
            sCtx.clearRect(0, 0, spaceCanvas.width, spaceCanvas.height);
            stars.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0.2) {
                    star.speed = -star.speed;
                }
                sCtx.beginPath();
                sCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                sCtx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                sCtx.fill();
            });
            requestAnimationFrame(animateSpace);
        }
        animateSpace();

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.exponentialRampToValueAtTime(80, now + 0.12);
                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.25, now + 0.01);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'win') {
                    const chords = [
                        [130.81, 196.00, 261.63],
                        [174.61, 220.00, 261.63],
                        [196.00, 246.94, 293.66],
                        [261.63, 329.63, 392.00, 523.25]
                    ];
                    chords.forEach((chord, step) => {
                        let startTime = now + step * 0.2;
                        chord.forEach(freq => {
                            let noteOsc = ctx.createOscillator();
                            let noteGain = ctx.createGain();
                            noteOsc.type = 'sine';
                            noteOsc.frequency.setValueAtTime(freq, startTime);
                            let duration = step === chords.length - 1 ? 1.2 : 0.35;
                            noteGain.gain.setValueAtTime(0, startTime);
                            noteGain.gain.linearRampToValueAtTime(0.1, startTime + 0.08);
                            noteGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
                            noteOsc.connect(noteGain);
                            noteGain.connect(ctx.destination);
                            noteOsc.start(startTime);
                            noteOsc.stop(startTime + duration);
                        });
                    });
                }
            } catch (e) {}
        }

        function toggleAccordion() {
            const content = document.getElementById('accordionContent');
            const btn = document.getElementById('accordionBtn');
            content.classList.toggle('show');
            btn.innerText = content.classList.contains('show') ? '▲ ゲームの説明を隠す' : '▼ ゲームの説明を見る';
        }

        // 状態管理
        let currentMode = 'play'; // 'play' or 'maker'
        let size = 4;
        let board = [];
        let moveCount = 0;
        let startTime = null;
        let timerInterval = null;
        let isCleared = false;
        let finalTimeStr = "0.0";
        let generatedUrl = "";

        // ローカルストレージキー（消えないように保存）
        const STORAGE_KEY = 'stargames_saved_stage';

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tabPlay').classList.toggle('active', mode === 'play');
            document.getElementById('tabMaker').classList.toggle('active', mode === 'maker');

            if (mode === 'maker') {
                document.getElementById('accordionContent').innerHTML = `
                    【メーカーモード】<br>
                    パネルをクリックして、クリア時の「初期状態」を自由にデザインできます。<br>
                    完成したら**「テストプレイして公開する」**ボタンを押してクリアを証明してください！
                `;
            } else {
                document.getElementById('accordionContent').innerHTML = `
                    パネルをクリックすると、上下左右の星が反転します。<br>すべてのパネルを「★」に揃えてクリアを目指しましょう！
                `;
            }
            initGame();
        }

        function changeSize() {
            size = parseInt(document.getElementById('sizeSelect').value);
            initGame();
        }

        function initGame() {
            size = parseInt(document.getElementById('sizeSelect').value);
            moveCount = 0;
            isCleared = false;
            clearInterval(timerInterval);
            startTime = null;
            document.getElementById('timer').innerText = 'タイム: 0.0秒';
            document.getElementById('moves').innerText = '手数: 0回';
            document.getElementById('win-overlay').style.display = 'none';

            const gridEl = document.getElementById('grid');
            let px = size === 5 ? '55px' : size === 3 ? '80px' : '70px';
            gridEl.style.gridTemplateColumns = `repeat(${size}, ${px})`;
            gridEl.style.gridTemplateRows = `repeat(${size}, ${px})`;

            if (currentMode === 'play') {
                // プレイモード：保存された自作ステージがあればそれを読み込む、なければデフォルトのシャッフル
                let loaded = loadCustomStage();
                if (loaded && loaded.size === size) {
                    board = loaded.board.map(row => [...row]);
                } else {
                    board = Array(size).fill(null).map(() => Array(size).fill(true));
                    let shuffleCount = size === 3 ? 3 : size === 4 ? 5 : 7;
                    for (let i = 0; i < shuffleCount; i++) {
                        let r = Math.floor(Math.random() * size);
                        let c = Math.floor(Math.random() * size);
                        toggleCellsSilent(r, c);
                    }
                    if (checkWin()) initGame();
                }
            } else {
                // メーカーモード：初期状態はすべて「★」または保存されているものから開始
                board = Array(size).fill(null).map(() => Array(size).fill(true));
            }

            renderControls();
            renderBoard();
        }

        function renderControls() {
            const controlsArea = document.getElementById('controlsArea');
            if (currentMode === 'play') {
                controlsArea.innerHTML = `<button class="action-btn" onclick="initGame()">やり直す</button>`;
            } else {
                controlsArea.innerHTML = `
                    <button class="action-btn" onclick="clearMakerBoard()">すべて☆にする</button>
                    <button class="action-btn sub-btn" onclick="testAndPublish()">🚀 テストプレイして公開</button>
                `;
            }
        }

        function clearMakerBoard() {
            playSound('click');
            board = Array(size).fill(null).map(() => Array(size).fill(false));
            renderBoard();
        }

        function startTimerIfNeeded() {
            if (!startTime && !isCleared) {
                startTime = Date.now();
                timerInterval = setInterval(() => {
                    let elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
                    document.getElementById('timer').innerText = `タイム: ${elapsed}秒`;
                }, 100);
            }
        }

        function toggleCellsSilent(r, c) {
            const directions = [[0, 0], [-1, 0], [1, 0], [0, -1], [0, 1]];
            directions.forEach(([dr, dc]) => {
                let nr = r + dr;
                let nc = c + dc;
                if (nr >= 0 && nr < size && nc >= 0 && nc < size) {
                    board[nr][nc] = !board[nr][nc];
                }
            });
        }

        function toggleCells(r, c) {
            if (isCleared) return;

            if (currentMode === 'maker') {
                // メーカーモードでは単独でON/OFFを切り替えて初期状態を作成できる
                playSound('click');
                board[r][c] = !board[r][c];
                renderBoard();
                return;
            }

            // プレイモード
            startTimerIfNeeded();
            playSound('click');
            moveCount++;
            document.getElementById('moves').innerText = `手数: ${moveCount}回`;

            toggleCellsSilent(r, c);
            renderBoard();

            if (checkWin()) {
                isCleared = true;
                clearInterval(timerInterval);
                finalTimeStr = ((Date.now() - startTime) / 1000).toFixed(1);
                
                playSound('win');
                document.getElementById('win-title').innerText = '🎉 クリア成功！ 🎉';
                document.getElementById('clear-stats').innerText = `タイム: ${finalTimeStr}秒 / 手数: ${moveCount}回`;
                document.getElementById('url-container').style.display = 'none';
                document.getElementById('win-overlay').style.display = 'flex';
            }
        }

        function testAndPublish() {
            // メーカーモードから「クリアできるかテスト」して公開用URLを発行
            // プレイヤー視点として一度コピーを作り、クリア可能か？いや、制作者が自分で解いて証明する形にする
            // ここでは「現在のボード状態を自作ステージとして保存し、プレイモードに切り替えて即座にテストプレイしてもらう」か、
            // あるいは「一発クリア証明」としてURLを発行する。今回は手軽にURLエンコードして保存します。
            
            // 保存処理
            saveCustomStage();

            // エンコード用データ文字列化（例: size=4&b=1011...）
            let bitStr = board.map(row => row.map(cell => cell ? '1' : '0').join('')).join('');
            let base64Data = btoa(size + ':' + bitStr);
            
            // 全画面表示ハッシュURLを作成
            let baseUrl = window.location.href.split('#')[0];
            generatedUrl = `${baseUrl}#play=${base64Data}`;

            playSound('win');
            document.getElementById('win-title').innerText = '🚀 公開準備完了！';
            document.getElementById('clear-stats').innerHTML = 'お見事！あなたのステージが完成しました。<br>以下の全画面プレイ用URLからいつでも遊べます！';
            document.getElementById('shareUrlBox').innerText = generatedUrl;
            document.getElementById('url-container').style.display = 'block';
            document.getElementById('win-overlay').style.display = 'flex';
        }

        function saveCustomStage() {
            const data = { size: size, board: board };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        function loadCustomStage() {
            let saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    return JSON.parse(saved);
                } catch(e) {}
            }
            return null;
        }

        function checkWin() {
            return board.every(row => row.every(cell => cell === true));
        }

        function renderBoard() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    const cellEl = document.createElement('div');
                    cellEl.className = 'cell';
                    let fontSize = size === 3 ? '2.4rem' : size === 5 ? '1.8rem' : '2.2rem';
                    cellEl.style.fontSize = fontSize;

                    if (board[r][c]) {
                        cellEl.classList.add('active');
                        cellEl.innerText = '★';
                    } else {
                        cellEl.innerText = '☆';
                    }
                    cellEl.onclick = () => toggleCells(r, c);
                    gridEl.appendChild(cellEl);
                }
            }
        }

        function copyShareUrl() {
            navigator.clipboard.writeText(generatedUrl).then(() => {
                alert('全画面プレイ用URLをコピーしました！');
            });
        }

        function tweetScore() {
            let text = encodeURIComponent(`自分で宇宙パズルを作ってクリアしました！\n全画面URL: ${generatedUrl}\n#☆★games #お星さまパズルメーカー`);
            window.open(`https://twitter.com/intent/tweet?text=${text}`, '_blank');
        }

        // 起動時にURLハッシュにステージデータが含まれていたら自動でプレイモードでロードする
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash.includes('#play=')) {
                try {
                    let hashData = window.location.hash.split('#play=')[1];
                    let decoded = atob(hashData);
                    let parts = decoded.split(':');
                    let s = parseInt(parts[0]);
                    let bitStr = parts[1];
                    
                    size = s;
                    document.getElementById('sizeSelect').value = size;
                    
                    board = [];
                    for (let i = 0; i < size; i++) {
                        let row = [];
                        for (let j = 0; j < size; j++) {
                            row.push(bitStr[i * size + j] === '1');
                        }
                        board.push(row);
                    }
                    currentMode = 'play';
                    document.getElementById('tabPlay').classList.add('active');
                    document.getElementById('tabMaker').classList.remove('active');
                } catch(e) {}
            }
            initGame();
        });
    </script>
</body>
</html>
